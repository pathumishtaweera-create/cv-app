[server]
# Enforce the 10 MB maximum upload limit at the Streamlit server level
maxUploadSize = 10
headless = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#0F2942"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
font = "sans serif"
